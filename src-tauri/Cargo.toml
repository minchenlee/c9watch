# The workspace (D32): `core` is the c9watch core (CLI, session readers)
# and never depends on tauri; this package is the Tauri GUI shell and the
# `c9watch` binary. Without `gui`
# the binary is the CLI over the core.
[workspace]
members = [".", "core"]
default-members = [".", "core"]
resolver = "2"

[workspace.package]
version = "0.12.0"
authors = ["minchenlee"]
edition = "2021"

# Lints for every crate in the workspace (each package opts in with
# `[lints] workspace = true`). CI runs `cargo clippy -- -D warnings` on the
# toolchain pinned in .github/workflows/ci.yml, so a new warning fails the PR.
[workspace.lints.rust]
# `mobile` is set by tauri-build. The CLI-only build has no tauri-build.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(mobile)"] }

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
# Style lints that would need a refactor to satisfy; not worth it here.
type_complexity = "allow"
new_without_default = "allow"
field_reassign_with_default = "allow"
items_after_test_module = "allow"
# Rewrites that read no better here (sort_by with a reversed compare,
# an `if` inside a match arm with side effects).
unnecessary_sort_by = "allow"
collapsible_match = "allow"

[package]
name = "c9watch"
version.workspace = true
description = "Monitor and control Claude Code sessions, with Codex and Cursor Agent visibility"
authors.workspace = true
edition.workspace = true
default-run = "c9watch"

[lints]
workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "c9watch_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = ["gui", "cli", "gateway-assets"]
gui = [
    "c9watch-core/gui",
    "dep:tauri",
    "dep:tauri-build",
    "dep:tauri-plugin-notification",
    "dep:ed25519-dalek",
    "dep:notify-rust",
    "dep:tauri-plugin-opener",
    "dep:tauri-plugin-dialog",
    "dep:tauri-plugin-updater",
    "dep:tauri-plugin-process",
    "dep:tauri-plugin-sharekit",
    "dep:axum",
    "dep:tokio",
    "dep:rand",
    "dep:mime_guess",
    "dep:base64",
    "dep:sha2",
    "dep:tauri-nspanel",
]
cli = ["c9watch-core/cli", "dep:clap", "dep:regex", "dep:tokio"]
gateway-assets = ["c9watch-core/gateway-assets"]

[build-dependencies]
tauri-build = { version = "2", features = [], optional = true }

[dependencies]
c9watch-core = { path = "core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1.0"
chrono = "0.4"
libc = "0.2.180"
uuid = { version = "1", features = ["v4"] }
rusqlite = { version = "0.32", features = ["bundled"] }
wait-timeout = "0.2"

# ── GUI-only dependencies ────────────────────────────────────────────
tauri = { version = "2", features = ["tray-icon"], optional = true }
tauri-plugin-notification = { version = "2", optional = true }
tauri-plugin-opener = { version = "2", optional = true }
tauri-plugin-dialog = { version = "2", optional = true }
tauri-plugin-updater = { version = "2", optional = true }
tauri-plugin-process = { version = "2", optional = true }
tauri-plugin-sharekit = { version = "0.3", optional = true }
axum = { version = "0.7", features = ["ws"], optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "io-util", "process", "signal", "fs", "time", "macros"], optional = true }
rand = { version = "0.8", optional = true }
mime_guess = { version = "2", optional = true }
base64 = { version = "0.22", optional = true }
sha2 = { version = "0.10", optional = true }
ed25519-dalek = { version = "2", optional = true }

# ── CLI-only dependencies ────────────────────────────────────────────
clap = { version = "4", features = ["derive"], optional = true }
regex = { version = "1", optional = true }

# ── macOS GUI-only ───────────────────────────────────────────────────
# tauri-nspanel provides NSPanel support for the popover (above fullscreen apps).
# It depends on tauri, so it must be optional and gated behind the gui feature.
tauri-nspanel = { git = "https://github.com/ahkohd/tauri-nspanel", rev = "da9c9a8d4eb7f0524a2508988df1a7d9585b4904", optional = true }

[dev-dependencies]
c9watch-core = { path = "core", features = ["test-support"] }
tempfile = "3"
tokio-tungstenite = "0.24"
futures-util = { version = "0.3", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
notify-rust = { version = "4", optional = true }

# Smaller dev and test builds: keep line tables for backtraces, drop full
# debug info.
[profile.dev]
debug = "line-tables-only"

[[example]]
name = "notification_smoke"
required-features = ["gui"]
