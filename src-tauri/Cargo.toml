# The workspace (D32): `core` is the c9watch core (engine, CLI, session
# readers) and never depends on tauri; `agent` is `c9watch-agent`; this
# package is the Tauri GUI shell and the `c9watch` binary. Without `gui`
# the binary is the CLI over the core.
[workspace]
members = [".", "core", "agent"]
# Commands from this directory cover all three, so `--features engine`,
# `--bin c9watch-agent` and `--bins` work as before the split.
default-members = [".", "core", "agent"]
resolver = "2"

[workspace.package]
version = "0.11.1"
authors = ["minchenlee"]
edition = "2021"

[package]
name = "c9watch"
version.workspace = true
description = "Monitor and control Claude Code sessions, with Codex and Cursor Agent visibility"
authors.workspace = true
edition.workspace = true
# Two binaries in engine builds: `cargo run` and `tauri dev` pick this one.
default-run = "c9watch"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "c9watch_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = ["gui", "cli", "gateway-assets"]
gui = [
    "c9watch-core/gui",
    "dep:tauri",
    "dep:tauri-build",
    "dep:tauri-plugin-notification",
    "dep:ed25519-dalek",
    "dep:notify-rust",
    "dep:tauri-plugin-opener",
    "dep:tauri-plugin-dialog",
    "dep:tauri-plugin-updater",
    "dep:tauri-plugin-process",
    "dep:tauri-plugin-sharekit",
    "dep:axum",
    "dep:tokio",
    "dep:rand",
    "dep:mime_guess",
    "dep:base64",
    "dep:sha2",
    "dep:tauri-nspanel",
    "dep:objc2-app-kit",
]
cli = ["c9watch-core/cli", "dep:clap", "dep:regex", "dep:tokio"]
# Agent engine (C1a): `c9watch engine` and `api`, plus the `c9watch-agent`
# binary (the `agent` package), unix only.
engine = ["cli", "c9watch-core/engine", "dep:sha2"]
gateway-assets = ["c9watch-core/gateway-assets"]
# Test-only PTY input and screen files for tests/live/cc_sandbox.sh (C1a-32).
# Never in release, default or CI builds.
live-test = ["engine", "c9watch-core/live-test"]

[build-dependencies]
tauri-build = { version = "2", features = [], optional = true }

[dependencies]
c9watch-core = { path = "core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1.0"
chrono = "0.4"
libc = "0.2.180"
uuid = { version = "1", features = ["v4"] }
rusqlite = { version = "0.32", features = ["bundled"] }
wait-timeout = "0.2"

# ── GUI-only dependencies ────────────────────────────────────────────
tauri = { version = "2", features = ["tray-icon", "macos-private-api"], optional = true }
tauri-plugin-notification = { version = "2", optional = true }
tauri-plugin-opener = { version = "2", optional = true }
tauri-plugin-dialog = { version = "2", optional = true }
tauri-plugin-updater = { version = "2", optional = true }
tauri-plugin-process = { version = "2", optional = true }
tauri-plugin-sharekit = { version = "0.3", optional = true }
axum = { version = "0.7", features = ["ws"], optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "io-util", "process", "signal", "fs", "time", "macros"], optional = true }
rand = { version = "0.8", optional = true }
mime_guess = { version = "2", optional = true }
base64 = { version = "0.22", optional = true }
sha2 = { version = "0.10", optional = true }
ed25519-dalek = { version = "2", optional = true }

# ── CLI-only dependencies ────────────────────────────────────────────
clap = { version = "4", features = ["derive"], optional = true }
regex = { version = "1", optional = true }

# ── macOS GUI-only ───────────────────────────────────────────────────
# tauri-nspanel provides NSPanel support for the popover (above fullscreen apps).
# It depends on tauri, so it must be optional and gated behind the gui feature.
tauri-nspanel = { git = "https://github.com/ahkohd/tauri-nspanel", rev = "da9c9a8d4eb7f0524a2508988df1a7d9585b4904", optional = true }

[dev-dependencies]
c9watch-core = { path = "core", features = ["test-support"] }
tempfile = "3"
tokio-tungstenite = "0.24"
futures-util = { version = "0.3", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
notify-rust = { version = "4", optional = true }
# Glass G10b: NSWorkspace.accessibilityDisplayShouldReduceTransparency.
# Already in the tree through tauri (wry, tao); this names two features.
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSAccessibility", "NSWorkspace"], optional = true }

# Smaller dev and test builds: keep line tables for backtraces, drop full
# debug info.
[profile.dev]
debug = "line-tables-only"

[[example]]
name = "notification_smoke"
required-features = ["gui"]
