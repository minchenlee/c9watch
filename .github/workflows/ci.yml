name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        # Pinned: clippy runs with -D warnings, and each stable release adds
        # lints. Bump this on purpose and fix the new warnings in that PR.
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: clippy, rustfmt

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Data layer import boundary
        run: |
          npm run lint:data
          npm run test:lint-data
          node --conditions=browser --test scripts/test-data-client.mjs scripts/test-annotations.mjs scripts/test-mail-store.mjs

      - name: Svelte check
        run: npm run check

      - name: WebSocket request regression tests
        run: node --test scripts/test-ws.mjs scripts/test-hidden-transitions.mjs scripts/test-opencode-provider.mjs scripts/test-opencode-connection.mjs scripts/test-integration-settings.mjs scripts/test-away-summary.mjs scripts/test-hidden-sessions.mjs scripts/test-dense-layout.mjs scripts/test-ipc-contract.mjs scripts/test-no-token-leak.mjs scripts/test-csp.mjs scripts/test-remote-access-ui.mjs scripts/test-glass-keys.mjs scripts/test-glass-tokens.mjs scripts/test-glass-ui.mjs scripts/test-glass-handling.mjs scripts/test-glass-pages.mjs scripts/test-webview-retain.mjs

      - name: Conversation selection regression tests
        run: node --conditions=browser --test scripts/test-conversation-selection.mjs scripts/test-preview-loader.mjs scripts/test-glass-model.mjs

      - name: Usage and polling regressions
        run: |
          node scripts/test-subagent-polling.mjs
          node scripts/test-subscription-polling.mjs
          node scripts/test-usage-preferences.mjs

      - name: Rust check
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Rust lint (clippy)
        # Lints are set in src-tauri/Cargo.toml [workspace.lints].
        run: |
          cargo clippy --manifest-path src-tauri/Cargo.toml \
            --workspace --all-targets -- -D warnings

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build frontend
        run: npm run build

      - name: CLI-only build check
        run: |
          cargo check --manifest-path src-tauri/Cargo.toml \
            --no-default-features --features cli

      - name: CLI-only lint (clippy)
        run: |
          cargo clippy --manifest-path src-tauri/Cargo.toml --workspace \
            --all-targets --no-default-features --features cli -- -D warnings

      - name: CLI-only tests
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml \
            --no-default-features --features cli

  visual-classic:
    # Classic must stay pixel-identical (core-public plan, M-c0). Fixed
    # runner image and fixed WebKit: Playwright is pinned exactly in
    # package.json, and each Playwright version pins one WebKit build.
    # Baselines are made here only, never on a local machine.
    #
    # No baselines yet: run 1 writes them, run 2 must match run 1 with 0
    # changed pixels, and the PNGs are uploaded as `classic-baseline` for an
    # owner-approved PR. These steps do not fail the job.
    # Baselines present: any changed pixel fails the job. Add this job to
    # the required checks of `main` to make it block merges.
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Playwright WebKit
        run: npx playwright install webkit

      - name: Record runner image and WebKit
        run: |
          echo "image: ${ImageOS:-unknown} ${ImageVersion:-unknown}"
          sw_vers
          npx playwright --version

      - name: Check for Classic baselines
        id: baseline
        run: |
          if ls tests/visual/classic/__screenshots__/*.png >/dev/null 2>&1; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No Classic baselines yet. This run makes them and uploads the classic-baseline artifact."
          fi

      - name: Compare with Classic baselines (blocking)
        if: steps.baseline.outputs.present == 'true'
        run: npm run test:visual

      - name: Glass interaction tests (vite dev, demo data)
        run: npx playwright test -c tests/glass/playwright.config.ts

      - name: Make Classic baselines (run 1)
        if: steps.baseline.outputs.present == 'false'
        continue-on-error: true
        run: npm run test:visual:update

      - name: Stability check (run 2 against run 1, 0 changed pixels)
        if: steps.baseline.outputs.present == 'false'
        continue-on-error: true
        run: npm run test:visual

      - name: Upload classic-baseline
        if: always() && steps.baseline.outputs.present == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: classic-baseline
          path: tests/visual/classic/__screenshots__/
          if-no-files-found: warn

      - name: Upload visual report
        if: failure() || steps.baseline.outputs.present == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: classic-visual-report
          path: |
            tests/visual/.cache/report/
            tests/visual/.cache/test-results/
          if-no-files-found: ignore

  linux-cli:
    # Linux ships the headless core and CLI. The Tauri GUI stays macOS-only.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system packages
        # reqwest uses native-tls, which links OpenSSL on Linux.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libssl-dev pkg-config

      - name: Install Rust
        # Pinned: clippy runs with -D warnings, and each stable release adds
        # lints. Bump this on purpose and fix the new warnings in that PR.
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: clippy, rustfmt

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Rust format check
        run: cargo fmt --all --manifest-path src-tauri/Cargo.toml -- --check

      - name: Core has no tauri (D32)
        # The core crate (session readers, CLI) never depends on tauri, with
        # any feature, on any target. Package names only: the path
        # `src-tauri/core` itself contains "tauri".
        run: |
          set -euo pipefail
          # Fails the step when cargo fails, even after partial output:
          # errexit is off inside $(...), so the status is returned by hand.
          names() {
            local out
            out=$(cargo tree --manifest-path src-tauri/Cargo.toml -p "$1" -e normal,build \
              --all-features --target all --prefix none --format '{p}') || return
            awk '{print $1}' <<<"$out" | sort -u
          }
          # The listing sees tauri where it is: in the GUI shell.
          gui=$(names c9watch)
          grep -qx c9watch <<<"$gui"
          grep -qx tauri <<<"$gui"
          list=$(names c9watch-core)
          grep -qx c9watch-core <<<"$list"
          if grep -i '^tauri' <<<"$list"; then
            echo "::error::c9watch-core depends on tauri"
            exit 1
          fi
          echo "c9watch-core: no tauri crate in $(wc -l <<<"$list") packages"

      - name: Core builds on its own (D32)
        # Workspace commands unify features across packages, so they can
        # hide a dependency that only another package turns on.
        run: |
          set -euo pipefail
          m=src-tauri/Cargo.toml
          for f in "" gui cli gateway-assets; do
            echo "c9watch-core features: ${f:-none}"
            cargo check --manifest-path "$m" -p c9watch-core --features "$f"
          done
          cargo check --manifest-path "$m" -p c9watch-core --all-features

      - name: Linux lint (clippy)
        # Some code is Linux-only (e.g. the IPv4 listener in gateway/policy.rs).
        run: |
          cargo clippy --manifest-path src-tauri/Cargo.toml --workspace \
            --all-targets --no-default-features --features cli -- -D warnings

      - name: Prod channel build check
        # CI builds are dev channel by default. Check the prod cfg path too.
        env:
          C9WATCH_CHANNEL: prod
        run: |
          cargo check --manifest-path src-tauri/Cargo.toml \
            --no-default-features --features cli

      - name: CLI-only tests
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml \
            --no-default-features --features cli

      - name: Build and smoke-test Linux CLI tarball
        env:
          C9WATCH_CHANNEL: prod
        run: |
          cargo build --release --manifest-path src-tauri/Cargo.toml \
            --no-default-features --features cli --bins
          stage=$(mktemp -d)
          tar -czf "$stage/c9watch-linux.tar.gz" -C src-tauri/target/release c9watch
          mkdir "$stage/unpacked"
          tar -xzf "$stage/c9watch-linux.tar.gz" -C "$stage/unpacked"
          "$stage/unpacked/c9watch" --version
