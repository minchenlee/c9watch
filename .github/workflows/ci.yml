name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Svelte check
        run: npm run check

      - name: WebSocket request regression tests
        run: node --test scripts/test-ws.mjs

      - name: Conversation selection regression tests
        run: node --conditions=browser --test scripts/test-conversation-selection.mjs

      - name: Usage and polling regressions
        run: |
          node scripts/test-subagent-polling.mjs
          node scripts/test-subscription-polling.mjs
          node scripts/test-usage-preferences.mjs

      - name: Rust check
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build frontend
        run: npm run build

      - name: CLI-only build check
        run: |
          cargo check --manifest-path src-tauri/Cargo.toml \
            --no-default-features --features cli

      - name: CLI-only tests
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml \
            --no-default-features --features cli
