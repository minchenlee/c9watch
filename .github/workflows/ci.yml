name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Data layer import boundary
        run: |
          npm run lint:data
          npm run test:lint-data
          node --conditions=browser --test scripts/test-data-client.mjs scripts/test-annotations.mjs

      - name: Svelte check
        run: npm run check

      - name: WebSocket request regression tests
        run: node --test scripts/test-ws.mjs scripts/test-hidden-transitions.mjs scripts/test-opencode-provider.mjs scripts/test-opencode-connection.mjs scripts/test-integration-settings.mjs scripts/test-away-summary.mjs scripts/test-hidden-sessions.mjs scripts/test-dense-layout.mjs scripts/test-ipc-contract.mjs scripts/test-no-token-leak.mjs scripts/test-csp.mjs scripts/test-remote-access-ui.mjs

      - name: Conversation selection regression tests
        run: node --conditions=browser --test scripts/test-conversation-selection.mjs scripts/test-preview-loader.mjs

      - name: Usage and polling regressions
        run: |
          node scripts/test-subagent-polling.mjs
          node scripts/test-subscription-polling.mjs
          node scripts/test-usage-preferences.mjs

      - name: Rust check
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: GUI with core integration tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --features engine

      - name: Build frontend
        run: npm run build

      - name: CLI-only build check
        run: |
          cargo check --manifest-path src-tauri/Cargo.toml \
            --no-default-features --features cli

      - name: CLI-only tests
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml \
            --no-default-features --features cli

      - name: Engine feature tests
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml \
            --no-default-features --features engine

      - name: PM orchestration tests
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml \
            --no-default-features --features pm-orchestration

      - name: Engine and legacy daemon coexistence test
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml \
            --no-default-features --features engine,pm-orchestration \
            --test engine_cli

  visual-classic:
    # Classic must stay pixel-identical (core-public plan, M-c0). Fixed
    # runner image and fixed WebKit: Playwright is pinned exactly in
    # package.json, and each Playwright version pins one WebKit build.
    # Baselines are made here only, never on a local machine.
    #
    # No baselines yet: run 1 writes them, run 2 must match run 1 with 0
    # changed pixels, and the PNGs are uploaded as `classic-baseline` for an
    # owner-approved PR. These steps do not fail the job.
    # Baselines present: any changed pixel fails the job. Add this job to
    # the required checks of `main` to make it block merges.
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Playwright WebKit
        run: npx playwright install webkit

      - name: Record runner image and WebKit
        run: |
          echo "image: ${ImageOS:-unknown} ${ImageVersion:-unknown}"
          sw_vers
          npx playwright --version

      - name: Check for Classic baselines
        id: baseline
        run: |
          if ls tests/visual/classic/__screenshots__/*.png >/dev/null 2>&1; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No Classic baselines yet. This run makes them and uploads the classic-baseline artifact."
          fi

      - name: Compare with Classic baselines (blocking)
        if: steps.baseline.outputs.present == 'true'
        run: npm run test:visual

      - name: Make Classic baselines (run 1)
        if: steps.baseline.outputs.present == 'false'
        continue-on-error: true
        run: npm run test:visual:update

      - name: Stability check (run 2 against run 1, 0 changed pixels)
        if: steps.baseline.outputs.present == 'false'
        continue-on-error: true
        run: npm run test:visual

      - name: Upload classic-baseline
        if: always() && steps.baseline.outputs.present == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: classic-baseline
          path: tests/visual/classic/__screenshots__/
          if-no-files-found: warn

      - name: Upload visual report
        if: failure() || steps.baseline.outputs.present == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: classic-visual-report
          path: |
            tests/visual/.cache/report/
            tests/visual/.cache/test-results/
          if-no-files-found: ignore

  linux-cli:
    # Linux ships the headless core and CLI. The Tauri GUI stays macOS-only.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system packages
        # reqwest uses native-tls, which links OpenSSL on Linux.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libssl-dev pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Rust format check
        run: cargo fmt --all --manifest-path src-tauri/Cargo.toml -- --check

      - name: Prod channel build check
        # CI builds are dev channel by default. Check the prod cfg path too.
        env:
          C9WATCH_CHANNEL: prod
        run: |
          cargo check --manifest-path src-tauri/Cargo.toml \
            --no-default-features --features engine

      - name: Prod channel has no shadow diff
        # C1a-17: the dev-only shadow diff and `engine shadow-report` are
        # not compiled into a prod channel build. Exact names, and both must
        # run: a renamed or cfg'd-out test fails the step, not skips it.
        env:
          C9WATCH_CHANNEL: prod
        run: |
          out=$(cargo test --manifest-path src-tauri/Cargo.toml \
            --no-default-features --features engine --lib -- --exact \
            engine_proto::channel_tests::prod_channel_build_has_no_shadow_diff \
            cli::dispatch_tests::shadow_report_only_in_dev_builds)
          echo "$out"
          echo "$out" | grep -q "test result: ok. 2 passed"

      - name: CLI-only tests
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml \
            --no-default-features --features cli

      - name: Engine feature tests
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml \
            --no-default-features --features engine

      - name: Live-test build check
        # The test-only `live-test` feature (tests/live/*.sh) is never
        # shipped and the scripts need a real claude. Only check that it
        # still compiles.
        run: |
          cargo check --manifest-path src-tauri/Cargo.toml \
            --no-default-features --features engine,live-test

      - name: Crash reconcile test (X9)
        # Uses the live-test crash failpoint with a fake claude, so it
        # runs in CI.
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml \
            --no-default-features --features engine,live-test \
            --test engine_cli an_engine_killed

      - name: Agent binary and default run target
        # C1a-21: Linux builds c9watch-agent by name, and `cargo run` with
        # two binaries still picks c9watch (`default-run`).
        run: |
          cargo build --manifest-path src-tauri/Cargo.toml \
            --no-default-features --features engine --bin c9watch-agent
          out=$(cargo run --manifest-path src-tauri/Cargo.toml \
            --no-default-features --features engine -- --version)
          echo "$out"
          echo "$out" | grep -q '^c9watch '

      - name: Build and smoke-test Linux core tarball
        env:
          C9WATCH_CHANNEL: prod
        run: |
          cargo build --release --manifest-path src-tauri/Cargo.toml \
            --no-default-features --features engine,cli --bins
          stage=$(mktemp -d)
          tar -czf "$stage/c9watch-linux.tar.gz" -C src-tauri/target/release c9watch c9watch-agent
          mkdir "$stage/unpacked"
          tar -xzf "$stage/c9watch-linux.tar.gz" -C "$stage/unpacked"
          "$stage/unpacked/c9watch" --version
          "$stage/unpacked/c9watch" engine --help
          "$stage/unpacked/c9watch-agent" --help
