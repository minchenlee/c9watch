name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            arch: aarch64
          - target: x86_64-apple-darwin
            arch: x86_64
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli@2

      - name: Build Tauri app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Apple code signing (optional — set these secrets to enable)
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # Apple notarization (optional — set these secrets to enable)
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npx tauri build --target ${{ matrix.target }}

      - name: Rename artifacts for clarity
        run: |
          cd src-tauri/target/${{ matrix.target }}/release/bundle
          if [ -d dmg ]; then
            for f in dmg/*.dmg; do
              mv "$f" "dmg/c9watch_${{ github.ref_name }}_${{ matrix.arch }}.dmg"
            done
          fi

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg-${{ matrix.arch }}
          path: src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg

      - name: Upload app bundle
        uses: actions/upload-artifact@v4
        with:
          name: macos-app-${{ matrix.arch }}
          path: src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app

      - name: Upload updater signature (if exists)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: updater-sig-${{ matrix.arch }}
          path: src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz*
          if-no-files-found: ignore

  build-cli:
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: c9watch-cli-aarch64-apple-darwin.tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: c9watch-cli-x86_64-apple-darwin.tar.gz
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: c9watch-cli-x86_64-unknown-linux-gnu.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Build CLI-only binary
        run: |
          cargo build --release --manifest-path src-tauri/Cargo.toml \
            --no-default-features --features cli \
            --target ${{ matrix.target }}

      - name: Sign CLI binary (macOS)
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          BINARY="src-tauri/target/${{ matrix.target }}/release/c9watch"
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          if [ -n "$APPLE_CERTIFICATE" ] && [ -n "$APPLE_SIGNING_IDENTITY" ]; then
            # Import certificate into a temporary keychain
            KEYCHAIN_PASSWORD=$(openssl rand -base64 32)
            security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
            security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
            security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
            echo "$APPLE_CERTIFICATE" | base64 --decode > $RUNNER_TEMP/certificate.p12
            security import $RUNNER_TEMP/certificate.p12 -P "$APPLE_CERTIFICATE_PASSWORD" \
              -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
            security list-keychain -d user -s "$KEYCHAIN_PATH"
            codesign --force --options runtime --sign "$APPLE_SIGNING_IDENTITY" "$BINARY"
            # Clean up sensitive files
            rm -f "$RUNNER_TEMP/certificate.p12"
            security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true
          else
            codesign --force --options runtime --sign - "$BINARY"
          fi

      - name: Package CLI binary
        run: |
          cd src-tauri/target/${{ matrix.target }}/release
          tar -czf "${{ matrix.artifact }}" c9watch
          mv "${{ matrix.artifact }}" ../../../../

      - name: Upload CLI artifact
        uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.target }}
          path: ${{ matrix.artifact }}

  create-release:
    needs: [build-macos, build-cli]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create .tar.gz from .app bundles (for Homebrew)
        run: |
          cd artifacts
          for arch in aarch64 x86_64; do
            if [ -d "macos-app-${arch}" ]; then
              cd "macos-app-${arch}"
              tar -czf "../c9watch_${{ github.ref_name }}_${arch}.app.tar.gz" *.app
              cd ..
            fi
          done

      - name: Generate updater JSON manifest
        run: |
          VERSION="${{ github.ref_name }}"
          # Strip 'v' prefix for semver compatibility (v0.2.0 -> 0.2.0)
          VERSION_NO_V="${VERSION#v}"
          DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          # Read signatures if they exist
          AARCH64_SIG=""
          X86_64_SIG=""
          if [ -f "artifacts/updater-sig-aarch64/"*.sig ]; then
            AARCH64_SIG=$(cat artifacts/updater-sig-aarch64/*.sig 2>/dev/null || echo "")
          fi
          if [ -f "artifacts/updater-sig-x86_64/"*.sig ]; then
            X86_64_SIG=$(cat artifacts/updater-sig-x86_64/*.sig 2>/dev/null || echo "")
          fi

          cat > artifacts/latest.json << MANIFEST
          {
            "version": "${VERSION_NO_V}",
            "notes": "See the release notes on GitHub",
            "pub_date": "${DATE}",
            "platforms": {
              "darwin-aarch64": {
                "signature": "${AARCH64_SIG}",
                "url": "https://github.com/${{ github.repository }}/releases/download/${VERSION}/c9watch_${VERSION}_aarch64.app.tar.gz"
              },
              "darwin-x86_64": {
                "signature": "${X86_64_SIG}",
                "url": "https://github.com/${{ github.repository }}/releases/download/${VERSION}/c9watch_${VERSION}_x86_64.app.tar.gz"
              }
            }
          }
          MANIFEST

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            artifacts/macos-dmg-*/*.dmg
            artifacts/*.app.tar.gz
            artifacts/cli-*/*.tar.gz
            artifacts/latest.json
